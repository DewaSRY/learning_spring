spring:
  application:
    name: BasicSpring


  datasource:
    url: jdbc:mysql://localhost:3306/basicsSpringdb
    username: basicsSpring
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false