spring:
  application:
    name: BasicSpring


  datasource:
    url: jdbc:mysql://localhost:3306/basicsSpringdb
    username: basicsSpring
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

flayway:
  enabled: false
  locations: classpath:db/migration
  baseline-on-migrate: false